<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <link rel="icon" href="images/6728487.png">
</head>
<body>
    <center>
        <h1>Student Details Form </h1>
    <form >
       <table>
        <tr>
            <td>Name:</td><td> <input type="text" placeholder="Enter your name"></td>
        </tr>
        <tr>
            <td>Age:</td><td><input type="number" placeholder="Enter your age"></td>
        </tr>
        <tr>
            <td>Eamil:</td><td><input type="text" placeholder="Enter your mail id"></td>
        </tr>
        <tr>
            <td>Password:</td><td><input type="password" placeholder="Enter your password"></td>
        </tr>
        <tr>
            <td>Address:</td><td><input type="text" placeholder="Enter our address"></td>
        </tr>
        <tr>
            <td>Department:</td>
            <td><select>
                <option>AI&DS</option>
                <option>CSE</option>
                <option>MECH</option>
                <option>ECE</option>
            </select>
            </td>
            <tr>
            <td>Upload your image:</td>
            <td><input type="file"></td>
        </tr>
        <tr>
            <td>Gender:</td>
            <td>
            <input type="radio" name="Gender" value="Male">Male
            <input type="radio" name="Gender" value="Female">Female 
            <input type="radio" name="Gender" value="Others">Others
        </td> 
        </tr>
        <tr>
            <td><input type="reset"></td><td><input type="submit"></td>
        </tr>
         </table>
    </form>
    </center>
</body>
</html>
